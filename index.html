<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem('finance-app-data') || 'null')
        const theme = stored?.data?.preferences?.theme === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#0b1120' : '#f1f5f9'
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>family-finances</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
